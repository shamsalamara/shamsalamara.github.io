name: Publish Shams Al Amara
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Prepare the public website
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/shams-public"
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='README.md' --exclude='site-v25.zip.part*' ./ "$RUNNER_TEMP/shams-public/"
          test -f "$RUNNER_TEMP/shams-public/index.html"
          test -f "$RUNNER_TEMP/shams-public/assets/header-brand-white.svg"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/shams-public
      - name: Publish the website
        id: deployment
        uses: actions/deploy-pages@v4
